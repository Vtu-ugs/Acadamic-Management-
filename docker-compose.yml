# Full-stack Academic Management System — the whole app in one command.
#
#   docker compose up -d --build      # build + start db, backend, frontend
#   open  https://localhost           # the app (API is proxied under /api)
#   (Run scripts/generate-cert.ps1 once first to create the TLS certificate.)
#
#   docker compose ps                 # check health
#   docker compose logs -f backend    # tail backend logs
#   docker compose down               # stop (database volume kept)
#   docker compose down -v            # stop AND wipe the database
#
# SECRETS: values below read from a git-ignored `.env` in this folder (copy
# `.env.example` → `.env`). The `:-default` fallbacks are DEV ONLY so the stack
# runs out of the box; set real secrets in `.env` before hosting (see SECURITY.md).
#
# FIRST-RUN DATABASE: on an empty volume, MySQL auto-runs every *.sql in
# database/docker-init/. Put your data there first (one-time):
#   "C:\xampp\mysql\bin\mysqldump.exe" -u root office_management > database/docker-init/01-data.sql
# (That dump carries the complete schema + your records + login accounts.)
# To run ONLY the database for local `npm run dev`: docker compose up -d db
services:
  db:
    image: mysql:8
    container_name: ams-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-office_dev_pw}
      MYSQL_DATABASE: ${DB_NAME:-office_management}
    ports:
      # Bound to localhost only — the DB is not reachable from other machines.
      # Other services reach it over the internal compose network as `db:3306`.
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/docker-init:/docker-entrypoint-initdb.d:ro   # auto-loaded on first init
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_PASSWORD:-office_dev_pw}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: ams-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy             # wait until MySQL is ready
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db                              # the compose service name
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-office_management}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-office_dev_pw}
      # Dev default is long enough to pass the production start-up guard, but is
      # NOT secret (it's in the repo). Override in `.env` for any real deployment.
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-in-dotenv-3b8f2a}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://localhost}
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: ams-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"       # HTTP — redirects to HTTPS
      - "443:443"     # HTTPS — the app. Open https://<server-ip>
    volumes:
      # TLS cert + key, generated per-server by scripts/generate-cert.ps1.
      # Mounted read-only; never baked into the image or committed to git.
      - ./certs:/etc/nginx/certs:ro

volumes:
  mysql_data:
