# ---------------------------------------------------------------------------
# HTTP (port 80): redirect everything to HTTPS. Nothing is served in the clear.
# ---------------------------------------------------------------------------
server {
  listen 80;
  server_name _;
  server_tokens off;
  return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
# HTTPS (port 443): the real app.
# The certificate + key are mounted into the container at /etc/nginx/certs
# (see docker-compose.yml). Generate them with scripts/generate-cert.ps1.
# ---------------------------------------------------------------------------
server {
  listen 443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # TLS certificate (self-signed for LAN/IP use, or a real one if you have it).
  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # Modern, safe TLS defaults.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  # Don't advertise the nginx version in responses / error pages.
  server_tokens off;

  # Compress text assets on the way out.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  # Security headers applied to every response.
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # Conservative CSP for a self-contained SPA. Vite inlines a small runtime, so
  # 'unsafe-inline' is needed for styles/scripts; tighten with hashes if desired.
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; frame-ancestors 'self'; base-uri 'self'" always;
  # HSTS: force HTTPS for a year. NOTE: browsers ignore HSTS for bare IP
  # addresses, so this only takes effect once you use a hostname/domain — it is
  # harmless (and correct to keep) either way.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Long-cache the hashed build assets; never cache the HTML shell so new
  # deploys are picked up immediately. NOTE: we use `expires` (not add_header)
  # here on purpose — an add_header inside a location REPLACES all inherited
  # add_headers, which would silently strip the server-level security headers
  # from these very responses. `expires` sets Cache-Control without that effect.
  location /assets/ {
    expires 1y;
  }
  location = /index.html {
    expires -1;   # Cache-Control: no-cache
  }

  # Single-page app: serve index.html for any route that isn't a real file,
  # so client-side routing (React Router) works on refresh/deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Forward API calls to the backend service on the compose network.
  # No trailing slash on proxy_pass -> the /api prefix is preserved.
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 20m;   # allow Excel/CSV import uploads
  }
}
